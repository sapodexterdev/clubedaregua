name: clubedaregua
description: SaaS mobile para barbearias com agendamento, pagamentos e gestão.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.5
  flutter_svg: 2.0.10+1
  geolocator: 13.0.2
  clubedaregua_shared:
    path: ../../packages/shared
  clubedaregua_gestao:
    path: ../gestao

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: packages/clubedaregua_shared/fonts/Inter-Variable.ttf
    - family: Barlow Condensed
      fonts:
        - asset: packages/clubedaregua_shared/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: packages/clubedaregua_shared/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: packages/clubedaregua_shared/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
