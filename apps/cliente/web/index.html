<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Clube da Regua - app premium de barbearia e agendamento.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Clube da Regua">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Clube da Regua</title>
  <style>
    html,
    body {
      background: #000000;
      color: #FFFFFF;
      font-family: Arial, Helvetica, sans-serif;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    #boot-splash {
      align-items: center;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .50), rgba(0, 0, 0, .24) 45%, rgba(5, 5, 5, .78)),
        url('boot-splash.png') center / cover no-repeat;
      display: flex;
      height: 100%;
      justify-content: center;
      left: 0;
      pointer-events: none;
      position: fixed;
      text-align: center;
      top: 0;
      transition: opacity .2s ease, visibility .2s ease;
      width: 100%;
      z-index: 1;
    }

    #boot-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    #boot-logo {
      animation: heartbeat 920ms ease-in-out infinite;
      filter: drop-shadow(0 0 16px rgba(243, 178, 0, .28));
      margin-top: -42%;
      width: clamp(112px, 34vw, 164px);
    }

    @keyframes heartbeat {
      0%, 45%, 100% { transform: scale(1); }
      10% { transform: scale(1.055); }
      19% { transform: scale(.985); }
      28% { transform: scale(1.032); }
    }

  </style>
</head>
<body>
  <div id="boot-splash">
    <img id="boot-logo" src="boot-logo.svg" alt="">
  </div>
  <script>
    function hideBootStatus() {
      document.getElementById('boot-splash')?.classList.add('is-hidden');
    }

    window.addEventListener('flutter-first-frame', hideBootStatus);

    const observer = new MutationObserver(() => {
      const flutterReady = document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
      if (flutterReady) {
        observer.disconnect();
        setTimeout(hideBootStatus, 500);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
