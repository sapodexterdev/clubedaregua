<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Clube da Regua - app premium de barbearia e agendamento.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Clube da Regua">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Clube da Regua</title>
  <style>
    html,
    body {
      background: #000000;
      color: #FFFFFF;
      font-family: Arial, Helvetica, sans-serif;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    #boot-splash {
      align-items: center;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .50), rgba(0, 0, 0, .24) 45%, rgba(5, 5, 5, .78)),
        url('assets/assets/images/splash_v3_barbearia_coldre_v2.png') center / cover no-repeat;
      display: flex;
      height: 100%;
      justify-content: center;
      left: 0;
      pointer-events: none;
      position: fixed;
      text-align: center;
      top: 0;
      transition: opacity .2s ease, visibility .2s ease;
      width: 100%;
      z-index: 1;
    }

    #boot-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    #boot-logo {
      animation: heartbeat 920ms ease-in-out infinite;
      filter: drop-shadow(0 0 16px rgba(243, 178, 0, .28));
      margin-top: -42%;
      width: clamp(112px, 34vw, 164px);
    }

    @keyframes heartbeat {
      0%, 45%, 100% { transform: scale(1); }
      10% { transform: scale(1.055); }
      19% { transform: scale(.985); }
      28% { transform: scale(1.032); }
    }

    #boot-error {
      align-items: center;
      background: rgba(5, 5, 5, .92);
      bottom: 0;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
      left: 0;
      padding: 24px;
      position: absolute;
      right: 0;
      text-align: center;
    }

    #reload-button {
      background: #F3B200;
      border: 0;
      border-radius: 999px;
      color: #09090B;
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
      pointer-events: auto;
      padding: 14px 22px;
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <img id="boot-logo" src="assets/assets/images/brand_v3_segunda_logo.svg" alt="">
    <div id="boot-error" hidden>
      <span id="boot-message"></span>
      <button id="reload-button" type="button">Atualizar app</button>
    </div>
  </div>
  <script>
    const bootMessage = document.getElementById('boot-message');
    const bootError = document.getElementById('boot-error');
    const reloadButton = document.getElementById('reload-button');

    function showBootError(message) {
      bootMessage.textContent = message;
      bootError.hidden = false;
    }

    function hideBootStatus() {
      document.getElementById('boot-splash')?.classList.add('is-hidden');
    }

    reloadButton.addEventListener('click', async () => {
      try {
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((name) => caches.delete(name)));
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
      } finally {
        window.location.href = '/?refresh=' + Date.now();
      }
    });

    window.addEventListener('error', (event) => {
      showBootError('Erro ao abrir o app. Toque em atualizar app.');
      console.error(event.error || event.message);
    });

    window.addEventListener('unhandledrejection', (event) => {
      showBootError('Erro ao carregar dados. Toque em atualizar app.');
      console.error(event.reason);
    });

    window.addEventListener('flutter-first-frame', hideBootStatus);

    const observer = new MutationObserver(() => {
      const flutterReady = document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
      if (flutterReady) {
        observer.disconnect();
        setTimeout(hideBootStatus, 500);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    setTimeout(() => {
      const flutterReady = document.querySelector('flutter-view, flt-glass-pane');
      if (!flutterReady) {
        showBootError('O app demorou para iniciar. Toque em atualizar app.');
      }
    }, 9000);
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
