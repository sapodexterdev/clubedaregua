<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Clube da Régua Gestão — painel para barbearias.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clube da Régua Gestão">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>Clube da Régua Gestão</title>
  <style>
    html,
    body {
      background: #09090B;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    #boot-splash {
      align-items: center;
      background: #09090B;
      display: flex;
      height: 100%;
      inset: 0;
      justify-content: center;
      pointer-events: none;
      position: fixed;
      transition: opacity 300ms ease, visibility 300ms ease;
      width: 100%;
      z-index: 9999;
    }

    #boot-splash::after {
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, .58),
        rgba(0, 0, 0, .34) 45%,
        rgba(5, 5, 5, .82)
      );
      content: '';
      inset: 0;
      position: absolute;
      z-index: 1;
    }

    #boot-background {
      height: 100%;
      inset: 0;
      object-fit: cover;
      object-position: center;
      position: absolute;
      width: 100%;
    }

    #boot-brand {
      align-items: center;
      display: flex;
      justify-content: center;
      position: relative;
      width: clamp(82px, 20vw, 118px);
      z-index: 2;
    }

    #boot-logo {
      animation: loading-pulse 1800ms ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(243, 178, 0, .28));
      opacity: .30;
      width: 100%;
    }

    #boot-fallback {
      animation: fallback-spin 900ms linear infinite;
      border: 3px solid rgba(243, 178, 0, .18);
      border-radius: 50%;
      border-top-color: #F3B200;
      height: 38px;
      position: absolute;
      width: 38px;
    }

    #boot-brand.logo-ready #boot-fallback {
      display: none;
    }

    #boot-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    @keyframes loading-pulse {
      0%, 100% {
        opacity: .30;
        transform: scale(.96);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fallback-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #boot-logo {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="boot-splash" aria-label="Carregando Clube da Régua Gestão">
    <img
      id="boot-background"
      src="__GESTAO_BOOT_SPLASH_DATA__"
      alt=""
      onerror="this.remove()"
    >
    <div id="boot-brand">
      <div id="boot-fallback"></div>
      <img
        id="boot-logo"
        src="__GESTAO_BOOT_LOGO_DATA__"
        alt="Clube da Régua"
        onload="this.parentElement.classList.add('logo-ready')"
        onerror="this.remove()"
      >
    </div>
  </div>
  <script>
    const bootStartedAt = Date.now();

    function hideBootSplash() {
      const elapsed = Date.now() - bootStartedAt;
      const delay = Math.max(0, 700 - elapsed);
      window.setTimeout(() => {
        document.getElementById('boot-splash')?.classList.add('is-hidden');
      }, delay);
    }

    window.addEventListener('flutter-first-frame', hideBootSplash);
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
