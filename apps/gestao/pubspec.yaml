name: clubedaregua_gestao
description: App de gestão do SaaS Clube da Régua para barbeiros, donos e equipes.
publish_to: "none"
version: 0.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_svg: 2.0.10+1
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  clubedaregua_shared:
    path: ../../packages/shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: packages/clubedaregua_shared/fonts/Inter-Variable.ttf
    - family: Barlow Condensed
      fonts:
        - asset: packages/clubedaregua_shared/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: packages/clubedaregua_shared/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: packages/clubedaregua_shared/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
